<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat & Rabbit Sitter</title>
    <!-- Favicon integrata con emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #e1e1e6;
            --text-muted: #a8a8b3;
            --primary: #8257e5;
            --primary-hover: #9466ff;
            --success: #04d361;
            --success-dark: #039647;
            --test-btn: #3498db;
            --test-btn-hover: #2980b9;
            --cal-btn: #27ae60;
            --cal-btn-hover: #219653;
            --border: #29292e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.6rem;
            color: #fff;
            margin: 0 0 6px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-card label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-color);
        }

        input[type="time"] {
            background: var(--bg-color);
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .date-info {
            font-weight: 600;
            font-size: 1.05rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }
        .status-badge.pending {
            background: rgba(230, 126, 34, 0.15);
            color: #f39c12;
        }
        .status-badge.done {
            background: rgba(4, 211, 97, 0.15);
            color: var(--success);
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-done {
            background-color: var(--success);
            color: #121214;
        }
        .btn-done:active {
            background-color: var(--success-dark);
        }
        .btn-done:disabled {
            background-color: #2a2a32;
            color: #555561;
            cursor: not-allowed;
        }

        .btn-cal {
            background-color: var(--cal-btn);
            color: white;
            font-size: 0.85rem;
            padding: 10px;
        }
        .btn-cal:active {
            background-color: var(--cal-btn-hover);
        }

        .btn-perm {
            background-color: var(--primary);
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-perm:active {
            background-color: var(--primary-hover);
        }

        .btn-test {
            background-color: var(--test-btn);
            color: white;
            width: 100%;
            margin-bottom: 16px;
        }
        .btn-test:active {
            background-color: var(--test-btn-hover);
        }

        .gps-status {
            background: rgba(130, 87, 229, 0.1);
            border: 1px dashed var(--primary);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🐾 Sitter Dashboard</h1>
        <p class="subtitle">Cat & Rabbit Sitter</p>
    </header>

    <div class="settings-card">
        <label for="testTime">⏰ Orario Promemoria:</label>
        <input type="time" id="testTime" value="19:00" onchange="updateTestTime()">
    </div>

    <button class="btn-perm" id="permBtn" onclick="requestPermissions()">🔔 Abilita Notifiche e GPS</button>
    <button class="btn-test" onclick="runTest()">🧪 Test Immediato Notifiche</button>
    
    <div class="gps-status" id="gpsStatus">
        📍 Destinazione: Via G. Ellero, 2, Pavia di Udine (In attesa GPS...)
    </div>

    <div id="tasksContainer"></div>
</div>

<script>
    const tasksData = [
        { id: 't1', dateStr: '2026-09-30', label: '30 Settembre' },
        { id: 't2', dateStr: '2026-10-01', label: '1 Ottobre' },
        { id: 't3', dateStr: '2026-10-02', label: '2 Ottobre' },
        { id: 't4', dateStr: '2026-10-03', label: '3 Ottobre' }
    ];

    const HOUSE_LATITUDE = 46.012500; 
    const HOUSE_LONGITUDE = 13.279700; 
    const RADIUS_METERS = 100; 

    let swRegistration = null;
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            swRegistration = reg;
        });
    }

    function getSavedTestTime() {
        return localStorage.getItem('sitter_test_time') || "19:00";
    }

    function updateTestTime() {
        const timeInput = document.getElementById('testTime').value;
        localStorage.setItem('sitter_test_time', timeInput);
        render();
    }

    function getSavedState() {
        const saved = localStorage.getItem('sitter_tasks_dark_v10');
        if (saved) return JSON.parse(saved);
        let initialState = {};
        tasksData.forEach(t => {
            initialState[t.id] = { done: false };
        });
        return initialState;
    }

    let state = getSavedState();

    function saveState() {
        localStorage.setItem('sitter_tasks_dark_v10', JSON.stringify(state));
    }

    function render() {
        const container = document.getElementById('tasksContainer');
        container.innerHTML = '';
        
        const currentTime = getSavedTestTime();
        document.getElementById('testTime').value = currentTime;

        tasksData.forEach(task => {
            const taskState = state[task.id];
            const card = document.createElement('div');
            card.className = 'card';

            const [year, month, day] = task.dateStr.split('-');
            const [hour, minute] = currentTime.split(':');
            
            const startDate = `${year}${month}${day}T${hour}${minute}00`;
            let endHour = String(parseInt(hour) + 1).padStart(2, '0');
            const endDate = `${year}${month}${day}T${endHour}${minute}00`;

            // Generazione file .ics incorporato per Apple Calendar / iOS nativo
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Cat Rabbit Sitter//IT
BEGIN:VEVENT
UID:${task.id}-${year}${month}${day}@cat-rabbit-sitter
DTSTAMP:${year}${month}${day}T000000Z
DTSTART:${startDate}
DTEND:${endDate}
SUMMARY:🐱🐰 Visita Gatto e Coniglio
DESCRIPTION:Turno di sittering in Via G. Ellero, 2, Pavia di Udine.
LOCATION:Via G. Ellero, 2, 33050 Pavia di Udine UD
END:VEVENT
END:VCALENDAR`;

            const encodedIcs = encodeURIComponent(icsContent);
            const appleCalendarUrl = `data:text/calendar;charset=utf8,${encodedIcs}`;

            card.innerHTML = `
                <div class="date-info">📅 ${task.label} - ${currentTime}</div>
                <div class="task-desc">🐱🐰 Visita gatto e coniglio</div>
                <div>
                    <span class="status-badge ${taskState.done ? 'done' : 'pending'}">
                        ${taskState.done ? 'Completato ✅' : 'In attesa ⏳'}
                    </span>
                </div>
                <a href="${appleCalendarUrl}" download="visita_${task.dateStr}.ics" style="text-decoration: none;">
                    <button class="btn-cal" style="width: 100%;">📅 Aggiungi ad Apple Calendar</button>
                </a>
                <button class="btn-done" id="btn-${task.id}" ${taskState.done ? 'disabled' : ''} onclick="confirmAndDone('${task.id}')">
                    ${taskState.done ? 'FATTO' : 'Segna come FATTO'}
                </button>
            `;
            container.appendChild(card);
        });

        if (Notification.permission === "granted") {
            document.getElementById('permBtn').style.display = 'none';
        }
    }

    function requestPermissions() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Notifiche abilitate con successo!");
                }
            });
        }
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(successPosition, errorPosition, {
                enableHighAccuracy: true,
                maximumAge: 30000,
                timeout: 27000
            });
            alert("GPS attivato per il rilevamento automatico dell'arrivo in Via Ellero.");
        }
        render();
    }

    async function runTest() {
        if (Notification.permission !== "granted") {
            alert("Prima abilita le notifiche cliccando il pulsante viola in alto!");
            return;
        }

        const chosenTime = getSavedTestTime();
        if (swRegistration && swRegistration.showNotification) {
            await swRegistration.showNotification("🚨 TEST NOTIFICA FORTE!", {
                body: `Questo è il test sonoro impostato per le ore ${chosenTime}!`,
                icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png",
                vibrate: [400, 200, 400, 200, 400],
                requireInteraction: true
            });
        } else {
            new Notification("🚨 TEST NOTIFICA FORTE!", {
                body: `Test per le ore ${chosenTime}!`,
                icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png"
            });
        }
        alert("✅ Test eseguito con successo!");
    }

    function confirmAndDone(id) {
        let task = tasksData.find(t => t.id === id);
        let isConfirmed = confirm(`Sei sicuro di aver fatto il turno del ${task.label}?`);
        
        if (isConfirmed) {
            state[id].done = true;
            saveState();
            render();
        }
    }

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
        let R = 6371000;
        let dLat = deg2rad(lat2 - lat1);
        let dLon = deg2rad(lon2 - lon1);
        let a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function deg2rad(deg) {
        return deg * (Math.PI / 180);
    }

    function successPosition(position) {
        let userLat = position.coords.latitude;
        let userLon = position.coords.longitude;
        let distance = getDistanceFromLatLonInMeters(userLat, userLon, HOUSE_LATITUDE, HOUSE_LONGITUDE);
        
        document.getElementById('gpsStatus').innerText = `📍 Via Ellero (Distanza attuale: ${Math.round(distance)}m)`;

        let now = new Date();
        let currentDateStr = now.toISOString().split('T')[0]; 
        let activeTask = tasksData.find(t => t.dateStr === currentDateStr && !state[t.id].done);

        if (activeTask) {
            if (distance <= RADIUS_METERS) {
                let nowTime = now.getTime();
                if (nowTime - lastGpsAlertTime > 2 * 60 * 60 * 1000) {
                    if (Notification.permission === "granted") {
                        const alertOptions = {
                            body: `Sei arrivato in Via G. Ellero, 2 per la visita del ${activeTask.label}! Clicca per segnare 'FATTO'.`,
                            icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png",
                            vibrate: [500, 200, 500, 200, 500],
                            requireInteraction: true
                        };

                        if (swRegistration) {
                            swRegistration.showNotification(`🏠 Arrivato a destinazione!`, alertOptions);
                        } else {
                            new Notification(`🏠 Arrivato a destinazione!`, alertOptions);
                        }
                    }
                    lastGpsAlertTime = nowTime;
                }
            }
        }
    }

    function errorPosition(error) {
        document.getElementById('gpsStatus').innerText = "📍 Errore GPS: controlla i permessi di localizzazione.";
    }

    let lastGpsAlertTime = 0;

    if (navigator.geolocation && Notification.permission === "granted") {
        navigator.geolocation.watchPosition(successPosition, errorPosition, { enableHighAccuracy: true });
    }

    render();
</script>

</body>
</html>
